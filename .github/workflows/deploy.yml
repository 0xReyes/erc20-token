name: Deploy ERC20 Token

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to deploy to (sepolia/mainnet/localhost)"
        required: true
        default: "sepolia"
      confirm:
        description: "Type 'DEPLOY' to confirm"
        required: true
        default: "NO"

env:
  TOKEN_NAME: ${{ vars.TOKEN_NAME || 'OFFICIAL Argueta' }}
  TOKEN_SYMBOL: ${{ vars.TOKEN_SYMBOL || 'Argueta' }}
  MAX_SUPPLY: ${{ vars.MAX_SUPPLY || '1000000' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env File
        run: |
          echo "ALCHEMY_SEPOLIA_URL=${{ secrets.ALCHEMY_SEPOLIA_URL }}" > .env
          echo "ALCHEMY_MAINNET_URL=${{ secrets.ALCHEMY_MAINNET_URL }}" >> .env
          echo "DEPLOYER_PRIVATE_KEY=${{ secrets.DEPLOYER_PRIVATE_KEY }}" >> .env
          echo "ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}" >> .env

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Validate Inputs
        run: |
          if [ "${{ github.event.inputs.network }}" != "sepolia" ] && [ "${{ github.event.inputs.network }}" != "mainnet" ] && [ "${{ github.event.inputs.network }}" != "localhost" ]; then
            echo "::error::Invalid network specified. Use 'sepolia', 'mainnet', or 'localhost'"
            exit 1
          fi

      - name: Deploy Token Contract
        id: deploy
        env:
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.ALCHEMY_MAINNET_URL || secrets.ALCHEMY_SEPOLIA_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          echo "Deploying to ${{ github.event.inputs.network }}..."
          OUTPUT=$(npx hardhat run scripts/deploy.js --network ${{ github.event.inputs.network }})
          echo "$OUTPUT"
          echo "contract_address=$(echo "$OUTPUT" | awk '/deployed to:/ {print $NF}')" >> $GITHUB_OUTPUT

      - name: Save Deployment Info
        if: success()
        run: |
          echo "Network: ${{ github.event.inputs.network }}" > deployment.txt
          echo "Address: ${{ steps.deploy.outputs.contract_address }}" >> deployment.txt
          echo "Name: ${{ env.TOKEN_NAME }}" >> deployment.txt
          echo "Symbol: ${{ env.TOKEN_SYMBOL }}" >> deployment.txt
          echo "DEPLOYMENT_INFO=deployment-info.md" >> $GITHUB_ENV

      - name: Upload Deployment Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: ${{ env.DEPLOYMENT_INFO }}
