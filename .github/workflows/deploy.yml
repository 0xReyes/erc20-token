name: Deploy ERC20 Token

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to deploy to (sepolia/mainnet)"
        required: true
        default: "sepolia"
      confirm:
        description: "Type 'DEPLOY' to confirm"
        required: true
        default: "NO"

env:
  TOKEN_NAME: ${{ vars.TOKEN_NAME || 'OFFICIAL Argueta' }}
  TOKEN_SYMBOL: ${{ vars.TOKEN_SYMBOL || 'Argueta' }}
  MAX_SUPPLY: ${{ vars.MAX_SUPPLY || '1000000' }} # Changed from MAX_SUPPLY to match contract

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DEPLOY'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Validate Inputs
        run: |
          if [ "${{ github.event.inputs.network }}" != "sepolia" ] && [ "${{ github.event.inputs.network }}" != "mainnet" ]; then
            echo "::error::Invalid network specified. Use 'sepolia' or 'mainnet'"
            exit 1
          fi

      - name: Deploy Token Contract
        id: deploy
        env:
          RPC_URL: ${{ github.event.inputs.network == 'mainnet' && secrets.ALCHEMY_MAINNET_URL || secrets.ALCHEMY_SEPOLIA_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          # Run deployment and capture output
          DEPLOY_OUTPUT=$(npx hardhat run scripts/deploy.js --network ${{ github.event.inputs.network }})
          echo "$DEPLOY_OUTPUT"
          
          # Extract contract address
          CONTRACT_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep -oE '✅ Token deployed to: 0x[a-fA-F0-9]{40}' | cut -d' ' -f4)
          echo "contract_address=$CONTRACT_ADDRESS" >> $GITHUB_OUTPUT
          
          # Verify address format
          if [[ ! "$CONTRACT_ADDRESS" =~ ^0x[a-fA-F0-9]{40}$ ]]; then
            echo "::error::Failed to extract valid contract address"
            exit 1
          fi

      - name: Verify Contract on Etherscan
        if: success() && github.event.inputs.network != 'localhost'
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          npx hardhat verify --network ${{ github.event.inputs.network }} \
            ${{ steps.deploy.outputs.contract_address }} \
            "${{ env.TOKEN_NAME }}" \
            "${{ env.TOKEN_SYMBOL }}" \
            "${{ env.MAX_SUPPLY }}" \
            "$(node -e "console.log(require('ethers').Wallet(process.env.DEPLOYER_PRIVATE_KEY).address)")"

      - name: Save Deployment Info
        if: always()
        run: |
          echo "Deployment Details:" >> deployment-info.md
          echo "- Network: ${{ github.event.inputs.network }}" >> deployment-info.md
          echo "- Contract Address: ${{ steps.deploy.outputs.contract_address }}" >> deployment-info.md
          echo "- Token Name: ${{ env.TOKEN_NAME }}" >> deployment-info.md
          echo "- Token Symbol: ${{ env.TOKEN_SYMBOL }}" >> deployment-info.md
          echo "- Max Supply: ${{ env.MAX_SUPPLY }}" >> deployment-info.md
          
          # Upload as artifact
          echo "DEPLOYMENT_INFO=deployment-info.md" >> $GITHUB_ENV

      - name: Upload Deployment Artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: deployment-info
          path: ${{ env.DEPLOYMENT_INFO }}